services:
    web:
        build: .
        restart: always
        env_file:
          - .env
    
    caddy:
        image: caddy:latest
        restart: always
    
        ports:
          - "80:80"
          - "443:443"
        volumes:
          - ./Caddyfile:/etc/caddy/Caddyfile
          - caddy_data:/data
          - caddy_config:/config
        depends_on:
          - web

volumes:
    caddy_data:
    caddy_config: